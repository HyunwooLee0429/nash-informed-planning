[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nash_informed"
version = "0.1.0"
description = "Nash-informed planning for integer programming games (EBMC, KEG, KPG)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "networkx>=3.0",
    "gurobipy>=10.0",
    "openpyxl>=3.1",
    "folium>=0.14",
    "pyproj>=3.4",
]

[tool.setuptools.packages.find]
include = ["nash_informed*"]
